<!DOCTYPE html>
<html lang="en" data-theme="dark" data-palette="theme-a">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Smart Navigator for real-world place search, road routing, nearby places, and route history." />
  <title>Smart Navigator | Real-World Map Navigation</title>

  <!-- Google Fonts: Public Sans & Roboto -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet" />

  <!-- Leaflet.js Mapping Library (Free, Open-Source) -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

  <!-- Design System & Stylesheets -->
  <link rel="stylesheet" href="styles/tokens.css" />
  <link rel="stylesheet" href="styles/main.css" />
  <link rel="stylesheet" href="styles/design.css" />
</head>
<body>
  <!-- Header Row (full width) -->
  <div id="header-mount"></div>

  <!-- Main Layout: Left Nav | Planner | Map -->
  <div class="app-body">
    <div id="left-nav-mount" class="left-nav-mount"></div>

    <div id="workspace-container" class="workspace-container">
      <div id="map-view-container" class="main-content">
        <!-- Interactive Map Area -->
        <main class="map-container" role="main">
          <div id="mapid" tabindex="0" role="region" aria-label="Interactive OpenStreetMap Campus Map"></div>
        </main>
      </div>
      <div id="history-mount" class="history-mount"></div>
    </div>
  </div>

  <!-- Application Bootstrap (ES6 Modules) -->
  <script type="module" src="scripts/app.js"></script>

</body>
</html>
